# Update Checker — daily upstream/custom-repo HEAD check per branch.
#
# For each build branch (master, openwrt-25.12) collects the OpenWrt HEAD plus
# the HEADs of all custom package repos, hashes the composite and compares it
# with the cached value. On change -> repository_dispatch "upstream-update"
# {branch} which triggers build.yml for that branch only.
#
# repository_dispatch created with GITHUB_TOKEN DOES trigger workflows
# (exception to the GITHUB_TOKEN recursion rule) — no PAT required.
# Cron 00:00 UTC = 03:00 MSK.

name: Update Checker

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: [master, openwrt-25.12]

    steps:
      - name: Collect HEADs
        id: heads
        run: |
          set -eu
          UP=$(git ls-remote https://github.com/openwrt/openwrt "refs/heads/${{ matrix.branch }}" | cut -f1)
          [ -n "$UP" ] || { echo "upstream branch not found" >&2; exit 1; }
          COMPOSITE="$UP"
          for r in \
            vernesong/OpenClash \
            itdoginfo/podkop \
            1andrevich/homeproxy-hiddify \
            yichya/luci-app-xray \
            jerrykuku/luci-theme-argon \
            1andrevich/zapret2-openwrt \
            slava-shchipunov/awg-openwrt \
            IncubusRK/luci-app-geodata \
            IncubusRK/luci-app-naiveproxy \
            IncubusRK/openwrt-mieru \
            lisaac/luci-app-diskman
          do
            H=$(git ls-remote "https://github.com/$r" HEAD | cut -f1)
            COMPOSITE="$COMPOSITE-$H"
          done
          HASH=$(printf '%s' "$COMPOSITE" | sha256sum | cut -d' ' -f1)
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "branch=${{ matrix.branch }} upstream=$UP composite=$HASH"

      - name: Lookup previous hash
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .checker-hash
          key: checker-${{ matrix.branch }}-${{ steps.heads.outputs.hash }}
          lookup-only: true

      - name: Trigger build on change
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event-type=upstream-update \
            -f 'client_payload[branch]=${{ matrix.branch }}'
          echo "${{ steps.heads.outputs.hash }}" > .checker-hash

      - name: Save new hash
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .checker-hash
          key: checker-${{ matrix.branch }}-${{ steps.heads.outputs.hash }}
